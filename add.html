<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predict Marks</title>
  <style>
    /* Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: linear-gradient(-45deg, #667eea, #764ba2, #ff6a00, #ffb347);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(0,0,0,0.45);
      padding: 3rem 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      text-align: center;
      width: 100%;
      max-width: 400px;
      transform: scale(0.9);
      opacity: 0;
      animation: fadeIn 1s forwards ease-in-out;
    }

    @keyframes fadeIn {
      to { transform: scale(1); opacity: 1; }
    }

    h2 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: #ffd700;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      font-weight: 700;
      user-select: none;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    label {
      font-weight: 600;
      font-size: 1rem;
      text-align: left;
      display: block;
      color: #fff;
      text-shadow: 0 0 2px rgba(0,0,0,0.7);
    }

    input[type="number"] {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      outline: none;
      transition: box-shadow 0.3s ease;
      background: rgba(255,255,255,0.9);
      color: #333;
      box-shadow: inset 2px 2px 6px rgba(0,0,0,0.1);
    }

    input[type="number"]:focus {
      box-shadow: 0 0 8px 3px #ffd700;
      background: #fff;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.8rem 0;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: linear-gradient(90deg, #ffda79, #fca311);
      color: #3b2f0b;
      box-shadow: 0 6px 14px rgba(252, 163, 17, 0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 24px rgba(252, 163, 17, 0.9);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container { padding: 2rem 1.5rem; }
      h2 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Predict Marks</h2>
    <form id="predictform" method="post" action="/predictmarks">
      <label for="hours">Study Hours</label>
      <input 
        type="number" 
        id="hours" 
        name="hours" 
        placeholder="Enter study hours" 
        required 
        min="0" step="0.1"
      />

      <label for="attendance">Attendance (%)</label>
      <input 
        type="number" 
        id="attendance" 
        name="attendance" 
        placeholder="Enter attendance %" 
        required 
        min="0" max="100" step="1"
      />

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
